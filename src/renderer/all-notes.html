<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' data:;">
  <title>StickyPad — All Notes</title>
  <link rel="stylesheet" href="all-notes.css">
</head>
<body>
  <div class="all-notes-app">
    <header class="all-notes-header">
      <div class="header-top">
        <h1 class="header-title">All Notes 📝</h1>
        <span id="notesCount" class="notes-count">0 notes</span>
      </div>

      <div class="search-wrapper">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Search notes... (Ctrl+F)" 
          autocomplete="off"
          spellcheck="false"
          autofocus
        >
        <button id="btnClearSearch" class="btn-clear hidden" title="Clear search">×</button>
      </div>
    </header>

    <main class="notes-content">
      <div id="notesList" class="notes-list">
        <!-- Dynamically rendered list of all notes -->
      </div>

      <div id="notesEmpty" class="notes-empty hidden">
        <div class="empty-icon">🔍</div>
        <div id="emptyTitle" class="empty-title">No matching notes</div>
        <div id="emptySubtitle" class="empty-subtitle">Try searching with a different keyword.</div>
      </div>
    </main>
  </div>

  <script src="all-notes.js"></script>
</body>
</html>
